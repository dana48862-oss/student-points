<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجوم الصف الرابع</title><style>
:root{--bg:#fffaf2;--ink:#17324d;--card:#fff;--gold:#ffbf3f;--blue:#58b8e8;--green:#62c99a;--pink:#f48fb1;--red:#e86b6b}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#fff8e8,#eefaff);color:var(--ink)}header{padding:20px;text-align:center;background:#fff;border-bottom:4px solid #dff2ff;position:sticky;top:0;z-index:3}h1{margin:0 0 8px;font-size:30px}.sub{font-size:14px}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:14px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:15px}.primary{background:var(--blue);color:#06304b}.warn{background:#ffe1e1;color:#7d1d1d}.ghost{background:#eef4f8;color:#24465e}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:14px}.pill{background:#fff;padding:10px 14px;border-radius:20px;box-shadow:0 3px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;padding:14px;max-width:1250px;margin:auto}.card{background:var(--card);border:2px solid #d9eef8;border-radius:22px;padding:14px;box-shadow:0 6px 18px #24465e12}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.name{font-weight:800;font-size:17px;line-height:1.5}.score{min-width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#fff4c9;border:3px solid var(--gold);font-size:22px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.plus1{background:#dff7ea}.plus2{background:#dff2ff}.minus{background:#ffe5e5}.reason{margin-top:10px;width:100%;padding:9px;border-radius:12px;border:1px solid #cfe1eb;background:#fbfdff}.badge{margin-top:8px;font-size:13px;font-weight:700;color:#527086;min-height:20px}.leader{max-width:900px;margin:0 auto 16px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 6px 18px #0001}.leader h2{margin:0 0 10px;text-align:center}.leaders{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.champ{padding:10px 14px;border-radius:16px;background:#fff4c9;font-weight:800}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17324d;color:#fff;padding:12px 18px;border-radius:18px;display:none;z-index:5}.search{max-width:500px;width:90%;padding:11px 14px;border:2px solid #cfe8f6;border-radius:16px;font-size:16px}footer{text-align:center;padding:20px;color:#6b8190;font-size:13px}@media(max-width:600px){h1{font-size:24px}.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>⭐ نجوم الصف الرابع ⭐</h1><div class="sub">نقاط للهدوء، حسن الاستماع، المشاركة، الإنجاز والتعاون</div><div class="toolbar"><input id="search" class="search" placeholder="ابحث عن اسم الطالب..."><button class="ghost" onclick="sortCards()">🏆 ترتيب بالنقاط</button><button class="warn" onclick="resetAll()">↻ حصة جديدة</button></div></header><div class="stats"><div class="pill">عدد الطلبة: <b id="count"></b></div><div class="pill">مجموع النجوم: <b id="total">0</b> ⭐</div></div><section class="leader"><h2>🏆 نجوم الحصة</h2><div id="leaders" class="leaders"></div></section><main id="grid" class="grid"></main><div id="toast" class="toast"></div><footer>كل نقطة تشجّع سلوكًا إيجابيًا 🌟</footer><script>
const students=[
'أحمد بن محمد بن سيف محمد القعنوني','إسحاق بن أيمن بن سليمان حمدان اللمكي','الجندبي بن مسعود بن مبارك سيف المقبالي','الفيصل بن طارق بن حمد سعيد البويقي','بثينة بنت مانع بن حسن سعيد السعدية','جود بنت عبدالسلام بن هديب يوسف السعدية','حمد بن أحمد بن عبدالله علي السعدي','حمدان بن خالد بن محمد علي المزروعي','حمدان بن محمد بن عبدالله سالم التبعي','رؤيا بنت محمد بن سالم هرمز الجابرية','رودينا بنت راشد بن خليفة ناصر الغافرية','ريام بنت عماد بن علي محمد الكلبانية','ريفال بنت سالم بن محمد إبراهيم البلوشية','ريم بنت خلفان بن سالم حمد القعنونية','سارة بنت أيمن بن سليمان حمدان اللمكية','سالم بن ساعد بن سالم خميس البويقي','سعود بن حمد بن عبدالله محمد المعمري','سيف بن سلطان بن محمد سليم القعنوني','شفا اشتياق حسين','شيخة بنت سيف بن خليفة سليمان العبرية','ضي بنت محمد بن حمد علي السعيدية','عبدالرحمن بن خالد بن ربيع بلال النوفلي','عبدالله بن مرتضى بن عبدالله سليمان العجمي','غالية بنت هلال بن طالب علي الغافرية','محمد بن خميس بن عبدالنبي عبدالله البلوشي','محمود بن خليل بن ذياب يعقوب السعدي','ميرة بنت سالم بن راشد زعل السعدية','نوف بنت خالد بن محمد خليفة السعدية','وليد بن خالد بن عبدالله سالم الغافري','وهب بن أيمن بن مبارك سليمان الهاشمي','يمنى بنت عبدالله بن راشد علي اليحمدية'];
let scores=JSON.parse(localStorage.getItem('grade4scores')||'{}'); students.forEach(n=>{if(scores[n]==null)scores[n]=0}); let sorted=[...students];
function badge(s){if(s>=12)return'👑 بطل الحصة';if(s>=8)return'🏆 نجم متميز';if(s>=5)return'🌟 أداء رائع';if(s>=3)return'✨ تقدم جميل';return'💙 استمر';}
function save(){localStorage.setItem('grade4scores',JSON.stringify(scores));updateStats()}
function change(n,d){scores[n]=Math.max(0,(scores[n]||0)+d);save();render();toast(d>0?'أحسنت! ⭐ تمت إضافة النقاط':'تم تعديل النقاط')}
function render(){const q=document.getElementById('search').value.trim();const g=document.getElementById('grid');g.innerHTML='';sorted.filter(n=>n.includes(q)).forEach(n=>{let c=document.createElement('div');c.className='card';c.innerHTML=`<div class="top"><div class="name">${n}</div><div class="score">${scores[n]}</div></div><select class="reason" aria-label="سبب النقطة"><option>🤫 الهدوء</option><option>👂 حسن الاستماع</option><option>🙋 المشاركة</option><option>✏️ إنجاز المهمة</option><option>🤝 التعاون</option></select><div class="actions"><button class="plus1" onclick='change(${JSON.stringify(n)},1)'>⭐ +1</button><button class="plus2" onclick='change(${JSON.stringify(n)},2)'>⭐⭐ +2</button><button class="minus" onclick='change(${JSON.stringify(n)},-1)'>−1</button></div><div class="badge">${badge(scores[n])}</div>`;g.appendChild(c)});updateStats()}
function updateStats(){document.getElementById('count').textContent=students.length;document.getElementById('total').textContent=Object.values(scores).reduce((a,b)=>a+b,0);const top=[...students].sort((a,b)=>scores[b]-scores[a]).slice(0,3).filter(n=>scores[n]>0);document.getElementById('leaders').innerHTML=top.length?top.map((n,i)=>`<div class="champ">${['🥇','🥈','🥉'][i]} ${n.split(' ').slice(0,3).join(' ')} — ${scores[n]} ⭐</div>`).join(''):'<span>ابدئي بإضافة النجوم ✨</span>'}
function sortCards(){sorted.sort((a,b)=>scores[b]-scores[a]||a.localeCompare(b,'ar'));render()}
function resetAll(){if(confirm('هل تريدين تصفير جميع النقاط وبدء حصة جديدة؟')){students.forEach(n=>scores[n]=0);sorted=[...students];save();render()}}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1200)}document.getElementById('search').addEventListener('input',render);render();
</script></body></html>
